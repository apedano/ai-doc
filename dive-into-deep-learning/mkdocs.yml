site_name: AI with Python
site_description: Personal Python notes about maths and data analysis
site_author: Alessandro

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.arithmatex: #MathJax support is built-in.
      generic: true
  - pymdownx.tabbed
  - toc:
      permalink: true
#MathJax lib
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
nav:
  - index.md
  - Introduction:
      - 001-introduction/index.md
      - 001-introduction/machine-learning-problems.md
  - Preliminaries:
      - 002-preliminaries/data-manipulation.md
      - 002-preliminaries/pandas.md
      - 002-preliminaries/linear-algebra.md
      - 002-preliminaries/eigencomposition.md
      - 002-preliminaries/calculus.md
      - 002-preliminaries/automatic_differentiation.md
      - 002-preliminaries/probability_statistics.md
  - Linear neural networks for regression:
      - 003-linear_neural_networks_for_regression/linear_regression.md
